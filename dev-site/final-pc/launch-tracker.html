  <!-- Palette and fonts come from the shared stylesheet; nothing here defines a color of its own. -->
  <link href="pc.css" rel="stylesheet" />

  <style>
    /* LAUNCH TRACKER: an internal, deliberately plain page laid out like a spreadsheet. No site header or footer.
       STATUS and PRIORITY colors use only the style-guide palette, so each value is told apart by three things at
       once: the fill, an icon, and the written label. Color is never the only signal. Statuses run light to dark as
       work moves toward launch. */
    body{ margin: 0; background: var(--pc-white); color: var(--pc-black); font-family: var(--font-sans); }
    .lt{ max-width: 1700px; margin: 0 auto; padding: var(--space-6) var(--space-5) var(--space-8); }
    .lt h1{ margin: 0 0 var(--space-2); font-family: var(--font-serif); font-weight: 500; font-size: 40px; line-height: 1.1; color: var(--pc-black); }
    .lt-sub{ margin: 0 0 var(--space-4); font-size: 15px; line-height: 1.5; }

    /* badges */
    .lt-badge{ display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border: 1px solid var(--pc-navy);
      border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 600; line-height: 1.4; white-space: nowrap; }
    .lt-badge i{ font-style: normal; font-size: 12px; line-height: 1; }
    .st-not-started{    background: var(--pc-white);       color: var(--pc-navy); }
    .st-in-process{     background: var(--pc-light-blue);  color: var(--pc-navy); }
    .st-approved{       background: var(--pc-medium-blue); color: var(--pc-white); border-color: var(--pc-medium-blue); }
    .st-submitted{      background: var(--pc-navy);        color: var(--pc-white); }
    .st-on-staging{     background: var(--pc-navy);        color: var(--pc-white); border: 2px solid var(--pc-light-blue); padding: 1px 8px; }
    .st-in-preview{     background: var(--pc-black);       color: var(--pc-white); border-color: var(--pc-black); }
    .st-live-on-preview{ background: var(--pc-black);      color: var(--pc-white); border-color: var(--pc-black); }
    .st-n-a{            background: var(--pc-white);       color: var(--pc-navy); border-style: dashed; }
    .lt-badge.pr{ border-radius: var(--radius-sm); }
    .pr-high{   background: var(--pc-black);       color: var(--pc-white); border-color: var(--pc-black); }
    .pr-medium{ background: var(--pc-medium-blue); color: var(--pc-white); border-color: var(--pc-medium-blue); }
    .pr-low{    background: var(--pc-soft-white);  color: var(--pc-navy); }

    .lt-bar{ display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); margin: 0 0 var(--space-3); font-size: 14px; }
    .lt-count{ margin: 0; font-weight: 600; }
    .lt-prog{ display: flex; align-items: center; gap: var(--space-2); flex: 1 1 200px; max-width: 360px; font-weight: 600; }
    .lt-prog-track{ flex: 1; height: 12px; background: var(--pc-soft-white); border: 1px solid var(--pc-navy); border-radius: var(--radius-pill); overflow: hidden; }
    .lt-prog-fill{ height: 100%; width: 0; background: var(--pc-navy); }
    .lt-prog-txt{ white-space: nowrap; }
    .lt-clear{ font: inherit; font-size: 13px; font-weight: 600; padding: 6px 12px; color: var(--pc-navy); background: var(--pc-white);
      border: 1px solid var(--pc-navy); border-radius: var(--radius-pill); cursor: pointer; }
    .lt-clear:hover{ background: var(--pc-light-blue); }
    .lt-clear:focus-visible{ outline: 2px solid var(--pc-navy); outline-offset: 2px; }

    /* the grid */
    .lt-wrap{ }
    .lt-table{ width: 100%; min-width: 1180px; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
    .lt-table th, .lt-table td{ padding: 8px 10px; text-align: left; vertical-align: top; font-size: 14px; line-height: 1.45;
      border-bottom: 1px solid rgba(18,64,106,.22); }
    .lt-table tbody tr:nth-child(even) td{ background: var(--pc-soft-white); }
    .lt-table tbody tr:hover td{ background: var(--pc-light-blue); }
    .lt-table thead th{ position: sticky; z-index: 2; background: var(--pc-navy); color: var(--pc-white); }
    .lt-table thead tr.lt-h th{ top: 0; height: 40px; padding: 0; border-bottom-color: rgba(255,255,255,.25); }
    .lt-table thead tr.lt-f th{ top: 40px; padding: 6px; background: var(--pc-light-blue); border-bottom: 2px solid var(--pc-navy); }
    .lt-sort{ display: flex; align-items: center; justify-content: space-between; gap: 6px; width: 100%; height: 40px; padding: 0 10px;
      font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; text-align: left;
      color: inherit; background: transparent; border: 0; cursor: pointer; }
    .lt-sort:hover{ background: rgba(255,255,255,.12); }
    .lt-sort:focus-visible{ outline: 2px solid var(--pc-white); outline-offset: -3px; }
    .lt-arrow{ font-size: 11px; letter-spacing: 0; }
    .lt-f input, .lt-f select{ width: 100%; box-sizing: border-box; font: 400 13px/1.3 var(--font-sans); padding: 6px 8px;
      color: var(--pc-black); background: var(--pc-white); border: 1px solid rgba(18,64,106,.45); border-radius: var(--radius-sm); }
    .lt-f input:focus, .lt-f select:focus{ outline: none; border-color: var(--pc-navy); box-shadow: 0 0 0 3px var(--pc-white); }
    .lt-pg{ font-weight: 600; }
    .lt-url{ font-size: 13px; word-break: break-all; }
    .lt-empty{ padding: var(--space-6) 0; font-size: 15px; }
    .lt-table .c-num{ width: 90px; }
    .lt-table td.c-num{ font-variant-numeric: tabular-nums; font-weight: 400; font-size: 10.5px; white-space: nowrap; }
    .lt-table .c-page{ width: 17%; } .lt-table .c-url{ width: 14%; }
    .lt-table .c-nst{ width: 150px; } .lt-table .c-pri{ width: 110px; } .lt-table .c-cmp{ width: 112px; }
    .lt-done{ display: inline-block; font-size: 18px; font-weight: 700; line-height: 1; color: var(--pc-navy); }
    .lt-table .c-cms{ width: 80px; } .lt-table .c-notes{ width: 17%; }
    .lt-table td.c-cmp, .lt-table td.c-cms{ text-align: center; }
    .lt-table thead th.c-cmp .lt-sort, .lt-table thead th.c-cms .lt-sort{ justify-content: center; }

  /* ======================================================================================================
     HOW TO ADD OR CHANGE A PAGE OR TASK
     Everything on the page is drawn from the DATA list below. Add a block, change a value, save.

       { name: "Page name", url: "/page-url", tasks: [
         { id: "109", text: "A task with no extras" },
         { id: "110", text: "A task with its own status and priority", status: "in-process", priority: "high" }
       ]},

     id        the permanent Task # (3 digits). It is written once and never changes or gets reused, so it stays with the
               task however the list is sorted, filtered or reordered. Give every new task the next unused number
               (after the highest id in this list). On a page with no tasks, put the id on the page itself:
               { id: "111", name: "Page name", url: "", tasks: [] }. Never delete a task to free its number: mark it
               Complete instead. A task or page with no id still shows, with a temporary number above the highest one.
     cms       optional, on a task (or on a page, for every row of it). true = a check mark: the change is made in the
               CMS. "?" = a question mark: not sure yet. false or left out = blank: the change is made in the site's code.
     notes     optional, free text, on a task (or on a page with no tasks). Shows in the Notes column after Task.
     name      the page's common name.
     url       optional. The page's address. Leave "" if it has none yet.
     status    optional, and only ever "live-on-preview". It marks a finished page: its row gets the Complete check mark. No other page-level status is read or shown; task statuses live on the tasks.
     tasks     optional. Each task is one row of its own. A task is plain text, or { text, status, priority }.
               A plain-text task starts as Not Started with no priority. A page with no tasks still shows one row.
     priority  optional, on a task. One of: high, medium, low (the PRIORITIES list below).
     complete  optional. true puts a check mark in the Complete column. Set it on the page when the page has no tasks,
               or on a task as { text: "...", complete: true }.

     To add a new kind of status or priority, add it to STATUSES or PRIORITIES and give it a matching .st-... or .pr-...
     rule in the styles above.
     ====================================================================================================== */

    { name: "Map of My Kingdom", url: "/map-of-my-kingdom", tasks: [{ id: "088", notes: "kiron - build", cms: false, text: "Build page" }] },
    { name: "Fall Seminar", url: "/fall-seminar", tasks: [{ id: "089", notes: "kiron - build", cms: false, text: "Build page" }] },
    { id: "090", name: "Form Submission Error", url: "/form-submission-failed", status: "live-on-preview", tasks: [] },
    { name: "Navigation", url: "", tasks: [
      { id: "091", notes: "waiting for cms to make this adjustment", cms: true, text: "In the nav, update the order to Traditional Search, Map Search, AI Search" },
      { id: "092", notes: "waiting for cms to make this fix", cms: true, text: "In the nav, rename Interactive Map to Map Search and have it go straight to the map view" },
      { id: "093", notes: "waiting on cms to apply this fix", cms: true, text: "I don't think we need the /interactive-map URL" },
      { id: "094", cms: false, text: "Everything under the company should go to the first column rather than being split into two.", status: "n-a", complete: true },
      { id: "095", cms: false, text: "Under Insights & News, we will want one more column for Data, which will have categories for FarmWorth and Returns & Values." }
    ]},
    { name: "Stats (site-wide)", url: "", tasks: [
      { id: "096", cms: false, text: "Get the number of states, team members, and offices right and consistent across the website", status: "in-preview", complete: true },
      { id: "097", notes: "kiron - will do full metadata audit before launch", cms: false, text: "Confirm all metadata is accurate" }
    ]},
    { name: "Farmland Insights / Farmland Data Widget", url: "", status: "live-on-preview", tasks: [
      { id: "098", cms: false, text: "Review this page (please send me the link when you get it)" }
    ]},
    { name: "CMS", url: "", tasks: [
      { id: "099", cms: true, text: "Job Descriptions", status: "on-staging" },
      { id: "100", cms: true, text: "Forms", status: "on-staging" },
      { id: "101", cms: true, text: "Publish fields/SEO block/preview/cache purge", status: "in-process" },
      { id: "102", cms: true, text: "Bios", status: "on-staging" },
      { id: "103", cms: true, text: "Announcements", status: "on-staging" },
      { id: "104", cms: true, text: "Pages and blocks", status: "not-started" },
      { id: "105", cms: true, text: "Navigation and site settings", status: "not-started" },
      { id: "106", cms: true, text: "White papers and newsletters", status: "not-started" },
      { id: "107", cms: true, text: "Redirects and error watch", status: "not-started" },
      { id: "108", cms: true, text: "Blog and categories", status: "not-started" }
    ]}
  ];

  (function(){
    var listEl = document.getElementById("lt-list"), countEl = document.getElementById("lt-count"),
        clearBtn = document.getElementById("lt-clear");
    var statusKeys = Object.keys(STATUSES), prioKeys = Object.keys(PRIORITIES);

    /* one row per task; a page with no tasks gets one row of its own */
    var ROWS = [];
    DATA.forEach(function(d){
      var notes = (d.tasks && d.tasks.length) ? d.tasks : [null];
      notes.forEach(function(n){
        var o = (n && typeof n === "object") ? n : { text: n };
        ROWS.push({
          page: d.name, url: d.url || "", pageStatus: d.status,
          note: o.text || "", notes: (o.text ? o.notes : d.notes) || "", noteStatus: o.text ? (o.status || "not-started") : "", priority: o.text ? (o.priority || "") : "",
          /* CMS column: true = CMS-driven, "?" = not sure, false = changed in the site's code. A task's own value wins
             over its page's. */
          cms: (o.text && o.cms !== undefined) ? o.cms : (d.cms || false),
          complete: (o.text ? !!o.complete : !!d.complete) || (d.status === "live-on-preview" && !o.text),
          idx: ROWS.length,
          /* Task #: the permanent id written in DATA. It belongs to the task, not to its position. */
          num: String((o.text ? o.id : d.id) || "")
        });
      });
    });
    /* A task added without an id gets the next free number so it still shows. Copy that number into DATA as its
       id to make it permanent. Duplicate ids are reported in the console. */
    (function(){
      var seen = {}, max = 0;
      ROWS.forEach(function(r){ if(r.num){ if(seen[r.num]) console.warn("Launch Tracker: duplicate Task # " + r.num); seen[r.num] = 1; max = Math.max(max, parseInt(r.num, 10) || 0); } });
      ROWS.forEach(function(r){ if(!r.num) r.num = ("000" + (++max)).slice(-3); });
    })();

    var COLS = [
      { key: "num",        label: "Task #",      cls: "c-num",  type: "text", nofilter: true },
      { key: "page",      label: "Page",        cls: "c-page", type: "page" },
      { key: "url",        label: "URL",         cls: "c-url",  type: "text", nofilter: true },
      { key: "note",       label: "Task",        cls: "c-note", type: "text" },
      { key: "notes",      label: "Kiron Notes", cls: "c-notes", type: "text", nofilter: true },
      { key: "noteStatus", label: "Task Status", cls: "c-nst",  type: "status" },
      /* PRIORITY column hidden for now. To bring it back, restore this line:
         { key: "priority", label: "Priority", cls: "c-pri", type: "prio" },
         and re-add the Priority cell (c6) to the row in draw(). The data and PRIORITIES list are kept. */
      { key: "cms",        label: "CMS",         cls: "c-cms",  type: "cms" },
      { key: "complete",   label: "Complete",    cls: "c-cmp",  type: "check" }
    ];
    var state = { sortKey: null, sortDir: 1, f: { complete: "no" } };   /* opens showing Complete = no (open work) */

    function el(tag, cls, text){
      var n = document.createElement(tag);
      if(cls) n.className = cls;
      if(text != null) n.textContent = text;
      return n;
    }
    function badge(kind, key){
      var map = kind === "pr" ? PRIORITIES : STATUSES;
      var s = map[key] || { label: key, icon: "" };
      var b = el("span", "lt-badge " + (kind === "pr" ? "pr pr-" : "st-") + key);
      var i = el("i", null, s.icon); i.setAttribute("aria-hidden", "true");
      b.appendChild(i); b.appendChild(document.createTextNode(s.label));
      return b;
    }
    function rank(col, v){
      if(col.type === "status") return v ? statusKeys.indexOf(v) : 99;
      if(col.type === "prio") return v ? prioKeys.indexOf(v) : 99;   /* high first */
      if(col.type === "cms") return v === true ? 0 : (v === "?" ? 1 : 2);   /* CMS first, then unsure */
      if(col.type === "check") return v ? 0 : 1;                      /* complete first */
      return (v || "").toLowerCase();
    }

    function passes(r){
      for(var i = 0; i < COLS.length; i++){
        var c = COLS[i], f = state.f[c.key];
        if(!f) continue;
        var v = r[c.key];
        if(c.type === "text"){ if(v.toLowerCase().indexOf(f.toLowerCase()) < 0) return false; }
        else if(c.type === "cms"){ if(f === "yes" ? v !== true : (f === "unsure" ? v !== "?" : v !== false)) return false; }
        else if(c.type === "check"){ if((f === "yes") !== !!v) return false; }
        else if(f === "__none"){ if(v) return false; }
        else if(v !== f) return false;
      }
      return true;
    }

    function visible(){
      var rows = ROWS.filter(passes);
      if(state.sortKey){
        var c = COLS.filter(function(x){ return x.key === state.sortKey; })[0];
        rows.sort(function(a, b){
          var x = rank(c, a[c.key]), y = rank(c, b[c.key]);
          if(x < y) return -1 * state.sortDir;
          if(x > y) return 1 * state.sortDir;
          return a.idx - b.idx;
        });
      }
      return rows;
    }

    /* header and filter row are built once so typing in a filter never loses focus */
    var table = el("table", "lt-table"), tbody = el("tbody"), sortBtns = {};
    (function build(){
      var thead = el("thead"), h = el("tr", "lt-h"), f = el("tr", "lt-f");
      COLS.forEach(function(c){
        var th = el("th", c.cls); th.scope = "col"; th.setAttribute("aria-sort", "none");
        var b = el("button", "lt-sort"); b.type = "button";
        b.appendChild(el("span", null, c.label));
        var ar = el("span", "lt-arrow", "⇅"); ar.setAttribute("aria-hidden", "true"); b.appendChild(ar);
        b.addEventListener("click", function(){
          if(state.sortKey !== c.key){ state.sortKey = c.key; state.sortDir = 1; }
          else if(state.sortDir === 1){ state.sortDir = -1; }
          else { state.sortKey = null; state.sortDir = 1; }
          draw();
        });
        th.appendChild(b); h.appendChild(th); sortBtns[c.key] = { th: th, arrow: ar };

        var fh = el("th"); var ctl;
        if(c.nofilter){
          f.appendChild(fh); return;
        }
        if(c.type === "text"){
          ctl = el("input"); ctl.type = "search"; ctl.placeholder = "Filter";
          ctl.addEventListener("input", function(){ state.f[c.key] = ctl.value.trim(); draw(); });
        } else if(c.type === "page"){
          ctl = el("select");
          var seenPg = {}, pgOpts = [["", "All"]];
          ROWS.forEach(function(r){ if(!seenPg[r.page]){ seenPg[r.page] = 1; pgOpts.push([r.page, r.page]); } });
          var pgAll = pgOpts.shift();
          pgOpts.sort(function(a, b){ return a[1].localeCompare(b[1], undefined, { sensitivity: "base" }); });
          pgOpts.unshift(pgAll);
          pgOpts.forEach(function(o){ var op = el("option", null, o[1]); op.value = o[0]; ctl.appendChild(op); });
          ctl.addEventListener("change", function(){ state.f[c.key] = ctl.value; draw(); });
        } else if(c.type === "cms"){
          ctl = el("select");
          [["", "All"], ["yes", "Yes"], ["no", "No"], ["unsure", "?"]].forEach(function(o){
            var op = el("option", null, o[1]); op.value = o[0]; ctl.appendChild(op);
          });
          ctl.addEventListener("change", function(){ state.f[c.key] = ctl.value; draw(); });
        } else if(c.type === "check"){
          ctl = el("select");
          [["", "All"], ["yes", "Yes"], ["no", "No"]].forEach(function(o){
            var op = el("option", null, o[1]); op.value = o[0]; ctl.appendChild(op);
          });
          ctl.addEventListener("change", function(){ state.f[c.key] = ctl.value; draw(); });
        } else {
          ctl = el("select");
          var opts = [["", "All"]];
          (c.type === "status" ? statusKeys : prioKeys).forEach(function(k){
            opts.push([k, (c.type === "status" ? STATUSES : PRIORITIES)[k].label]);
          });
          opts.forEach(function(o){ var op = el("option", null, o[1]); op.value = o[0]; ctl.appendChild(op); });
          ctl.addEventListener("change", function(){ state.f[c.key] = ctl.value; draw(); });
        }
        ctl.setAttribute("aria-label", "Filter " + c.label);
        ctl.dataset.key = c.key;
        fh.appendChild(ctl); f.appendChild(fh);
      });
      thead.appendChild(h); thead.appendChild(f); table.appendChild(thead); table.appendChild(tbody);
    })();

    var wrap = el("div", "lt-wrap"); wrap.appendChild(table);
    var emptyEl = el("p", "lt-empty", "Nothing matches these filters."); emptyEl.hidden = true;
    listEl.appendChild(wrap); listEl.appendChild(emptyEl);

    function draw(){
      var rows = visible();
      tbody.textContent = "";
      rows.forEach(function(r){
        var tr = el("tr");
        var c0 = el("td", "c-num", r.num);
        var c1 = el("td"); c1.appendChild(el("span", "lt-pg", r.page));
        var c2 = el("td"); if(r.url) c2.appendChild(el("span", "lt-url", r.url));
        var c4 = el("td", null, r.note);
        var c8 = el("td", "c-cms");
        if(r.cms === true){
          var cm = el("span", "lt-done", "✓"); cm.setAttribute("aria-hidden", "true");
          c8.appendChild(cm); c8.appendChild(el("span", "sr-only", "CMS-driven"));
        } else if(r.cms === "?"){
          var cq = el("span", "lt-done", "?"); cq.setAttribute("aria-hidden", "true");
          c8.appendChild(cq); c8.appendChild(el("span", "sr-only", "Not sure if CMS-driven"));
        }
        var c5 = el("td"); if(r.noteStatus) c5.appendChild(badge("st", r.noteStatus));
        var c7 = el("td", "c-cmp");
        if(r.complete){
          var ck = el("span", "lt-done", "✓"); ck.setAttribute("aria-hidden", "true");
          c7.appendChild(ck); c7.appendChild(el("span", "sr-only", "Complete"));
        }
        var c4n = el("td", null, r.notes);
        [c0, c1, c2, c4, c4n, c5, c8, c7].forEach(function(c){ tr.appendChild(c); });
        tbody.appendChild(tr);
      });
      emptyEl.hidden = rows.length > 0;
      COLS.forEach(function(c){
        var s = sortBtns[c.key], on = state.sortKey === c.key;
        s.th.setAttribute("aria-sort", on ? (state.sortDir === 1 ? "ascending" : "descending") : "none");
        s.arrow.textContent = on ? (state.sortDir === 1 ? "▲" : "▼") : "⇅";
      });
      countEl.textContent = "Showing " + rows.length + " of " + ROWS.length + " rows";
      /* progress: Complete rows over all rows (ignores filters) */
      var doneN = ROWS.filter(function(r){ return r.complete; }).length,
          pct = ROWS.length ? Math.round(doneN / ROWS.length * 100) : 0;
      document.getElementById("lt-prog-fill").style.width = pct + "%";
      var pt = document.getElementById("lt-prog-track");
      pt.setAttribute("aria-valuenow", pct);
      pt.setAttribute("aria-valuetext", doneN + " of " + ROWS.length + " rows complete");
      document.getElementById("lt-prog-txt").textContent = pct + "% complete";
    }

    table.querySelector('.lt-f select[data-key="complete"]').value = "no";

    clearBtn.addEventListener("click", function(){
      state = { sortKey: null, sortDir: 1, f: {} };
      table.querySelectorAll(".lt-f input").forEach(function(i){ i.value = ""; });
      table.querySelectorAll(".lt-f select").forEach(function(s){ s.value = ""; });
      draw();
    });
    draw();
  })();
  </script>
</body>
